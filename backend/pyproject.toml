[project]
name = "catalogo-backend"
version = "1.0.0"
description = "API Django Ninja do Catálogo Geek"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "django-ninja>=1.0",
    "dj-database-url>=2.0",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "httpx>=0.25",
    "gunicorn>=21.0",
    "whitenoise>=6.6",
]

[tool.ruff]
exclude = [
    ".venv",
    "venv",
    "migrations",
    "__pycache__",
    "manage.py",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
exclude = [
    ".venv",
    "venv",
    "migrations",
    "__pycache__",
    "manage.py",
]
